<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
  <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700" onload="this.rel='stylesheet'" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <title>Record Dream</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style type="text/tailwindcss">
    :root {
      --primary-color: #1313ec;
    }
  </style>
</head>
<body class="bg-gray-900 text-white" style='font-family: "Space Grotesk", "Noto Sans", sans-serif;'>

<div class="relative flex min-h-screen flex-col justify-between">

  <!-- Header -->
  <header class="flex items-center p-4">
    <button class="text-white">
      <span class="material-symbols-outlined"> arrow_back </span>
    </button>
    <h1 class="text-white text-lg font-bold flex-1 text-center pr-8">Record Dream</h1>
  </header>

  <!-- Main -->
  <main class="flex-1 flex flex-col items-center justify-start p-6 w-full max-w-lg mx-auto">
    
    <!-- Mic Icon (디자인 그대로 유지) -->
    <!-- <div class="relative w-40 h-40 mx-auto mb-6">
      <div class="absolute inset-0 bg-indigo-500/20 rounded-full animate-pulse"></div>
      <div class="absolute inset-2 bg-indigo-500/30 rounded-full animate-pulse delay-75"></div>
      <div class="absolute inset-4 bg-primary rounded-full flex items-center justify-center text-white">
        <span class="material-symbols-outlined text-6xl"> mic </span>
      </div>
    </div> -->

    <div class="relative w-40 h-40 mx-auto mb-6">
      <!-- 🔹 첫 번째 퍼지는 원 -->
      <div class="absolute inset-0 bg-indigo-500/20 rounded-full animate-pulse"></div>
      <!-- 🔹 두 번째 반투명 원 -->
      <div class="absolute inset-2 bg-indigo-500/30 rounded-full animate-pulse delay-75"></div>
      <!-- 🔹 중앙 아이콘 영역 -->
      <div class="absolute inset-4 bg-indigo-600/40 rounded-full flex items-center justify-center">
        <span class="material-symbols-outlined text-[4rem] text-indigo-300 drop-shadow-md">
          mic
        </span>
      </div>
    </div>

    <!-- 설명 -->
    <h2 class="text-2xl font-bold mb-2">Describe your dream</h2>
    <p class="text-gray-400 text-base mb-6">You can type your dream below and save it. We will summarize it and extract keywords for you.</p>

    <!-- 꿈 입력창 -->
    <textarea id="dreamStory" class="w-full p-3 rounded-lg text-black text-base mb-4" rows="4" placeholder="Write your dream story here..."></textarea>

    <!-- 저장 버튼 -->
    <button id="saveBtn"  type="button" class="w-full h-14 bg-primary text-white text-lg font-bold rounded-xl hover:bg-indigo-500 transition-colors duration-300">
       Save Dream
    </button>

    <!-- 결과 표시 영역 -->
    <div id="result" class="w-full mt-8 hidden text-left">
      <h3 class="text-xl font-bold mb-2">Summary</h3>
      <p id="summaryText" class="text-gray-300 mb-4"></p>

      <h3 class="text-xl font-bold mb-2">Keywords</h3>
      <div id="keywords" class="flex flex-wrap gap-2"></div>
    </div>

  </main>


</div>

<!-- JS 로직 -->
<script>
    document.getElementById("saveBtn").addEventListener("click", async () => {
      // const story = document.getElementById("dreamStory").value;
      const story = document.getElementById("dreamStory").value.trim();
      if (!story) {
        alert("Please write your dream first!");
        return;
      }
    
      // const response = await fetch("/finalize_dream", {
      //   method: "POST",
      //   headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify({ dream_story: story })
      // });
    
      // dream_story를 로컬스토리지에 저장
      localStorage.setItem("dream_story", story);
    
      // 질문/답변 페이지로 이동
      window.location.href = "/review";
    });
    
</script>
{% include 'footer.html' %}
</body>
</html>
