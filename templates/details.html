    <!-- Confirm 버튼 -->
<div class="sticky bottom-20 px-4 mt-6">
  <button id="confirmBtn"
    class="w-full h-14 bg-[var(--primary-color)] text-white text-lg font-bold rounded-xl hover:bg-indigo-600 transition">
    Confirm
  </button>
</div>

    
<!-- JS 로직 -->
<script>
   document.addEventListener("DOMContentLoaded", () => {
    const data = JSON.parse(sessionStorage.getItem("dreamDetails"));
    if (!data) return;

    // Dream Summary
    document.getElementById("summaryText").innerText = data.final_content;
       
    // 키워드 렌더링
    const keywordsDiv = document.getElementById("keywords");
    keywordsDiv.innerHTML = ""; 
    data.keywords.forEach(kw => {
      const pill = document.createElement("span");
      pill.className = "px-3 py-1 bg-indigo-600 text-white rounded-full text-sm cursor-pointer hover:bg-indigo-500";
      pill.innerText = kw;

      pill.addEventListener("click", () => {
        sessionStorage.setItem("selectedKeyword",  pill.innerText); // ✅ 클릭한 키워드 저장
        window.location.href = "/market";             // Market 페이지 이동
      });

      keywordsDiv.appendChild(pill);
    });


    // ✅ Dream Images 동적 생성
    const summary = sessionStorage.getItem("dream_summary") || data.final_content || "A mysterious dream";
    const container = document.getElementById("imageGrid");
    
    // 로딩 표시
    container.innerHTML = `
      <div class="flex items-center justify-center aspect-square bg-gray-800 rounded-2xl animate-pulse text-gray-400 col-span-2">
        Generating dream images...
      </div>
    `;
    
    fetch("/dream_images", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ summary })
    })
      .then(res => res.json())
      .then(imgData => {
        container.innerHTML = ""; // ✅ 로딩 제거
        if (imgData.images) {

          sessionStorage.setItem("dream_first_image", imgData.images[0]);
            
          imgData.images.forEach(url => {
            const div = document.createElement("div");
            div.className = "w-full bg-center bg-no-repeat aspect-square bg-cover rounded-2xl";
            div.style.backgroundImage = `url(${url})`;
            container.appendChild(div);
          });
        } else {
          container.innerHTML = "<p class='text-slate-400 col-span-2'>No images generated</p>";
        }
      })
      .catch(err => {
        console.error("Error loading dream images:", err);
        container.innerHTML = "<p class='text-red-400 col-span-2'>Failed to generate images</p>";
      });
       
    // Confirm → 첫 번째 키워드 선택
    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (data.keywords && data.keywords.length > 0) {
        const firstKeyword = data.keywords[0].replace(/^\d+\.\s*/, "");
        sessionStorage.setItem("selectedKeyword", firstKeyword);
      }
      window.location.href = "/market";
    });
  });
</script>
