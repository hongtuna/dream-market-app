<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
  <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans:wght@400;500;700;900&amp;family=Space+Grotesk:wght@400;500;700" onload="this.rel='stylesheet'" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <title>Dream Market</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style type="text/tailwindcss">
    :root { --primary-color: #1313ec; }
  </style>
</head>
<body class="bg-[#111118] text-white" style='font-family:"Space Grotesk","Noto Sans",sans-serif;'>

<div class="relative flex min-h-screen flex-col">
  <!-- Header -->
  <header class="flex items-center justify-between p-4 sticky top-0 bg-[#111118]/80 backdrop-blur-sm z-10">
    <button onclick="history.back()" class="text-white flex size-10 items-center justify-center rounded-full hover:bg-white/10 transition-colors">
      <span class="material-symbols-outlined"> arrow_back </span>
    </button>
    <h1 class="text-white text-lg font-bold">Keyword Insights</h1>
    <div class="size-10"></div>
  </header>

  <!-- Main -->
  <main class="flex-1 px-4 py-6 space-y-8">
    <!-- Hero -->
    <div class="space-y-2">
      <h2 id="keywordTitle" class="text-white text-4xl font-bold leading-tight">Loading...</h2>
      <p id="keywordDesc" class="text-slate-400 text-base font-normal leading-normal">Loading description...</p>
    </div>

    <!-- Market Performance -->
    <section>
      <h3 class="text-white text-xl font-bold mb-4">Market Performance</h3>
      <div class="grid grid-cols-3 gap-4">
        <div class="flex flex-col gap-2 rounded-xl p-4 bg-[#1C1C27] text-center">
          <p class="text-slate-400 text-sm">Demand</p>
          <p id="demandText" class="text-white text-2xl font-bold">-</p>
        </div>
        <div class="flex flex-col gap-2 rounded-xl p-4 bg-[#1C1C27] text-center">
          <p class="text-slate-400 text-sm">Usage</p>
          <p id="usageText" class="text-white text-2xl font-bold">-</p>
        </div>
        <div class="flex flex-col gap-2 rounded-xl p-4 bg-[#1C1C27] text-center">
          <p class="text-slate-400 text-sm">Growth</p>
          <p id="growthText" class="text-green-400 text-2xl font-bold">-</p>
        </div>
      </div>
    </section>

    <section>
      <h3 class="text-white text-xl font-bold mb-4">Historical Data</h3>
      <div class="rounded-xl bg-[#1C1C27] p-4 border border-slate-700/50">
        <p class="text-white text-base mb-4">Usage Over Time</p>
        <canvas id="usageChart" height="150"></canvas>
      </div>
    </section>
      
    <!-- Creator Insights -->
    <section class="space-y-4">
      <h3 class="text-white text-xl font-bold">Creator Insights</h3>
      <p id="creatorInsight" class="text-slate-400 text-base">Loading insight...</p>
      <div class="flex gap-3 pt-2">
          <button id="investBtn" class="w-full rounded-xl h-12 px-4 bg-[var(--primary-color)] text-white font-bold hover:bg-blue-600 transition">
              Invest
          </button>
      </div>
    </section>
  </main>

</div>

    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
 document.addEventListener("DOMContentLoaded", () => {
    const investBtn = document.getElementById("investBtn");
    if (investBtn) {
      investBtn.addEventListener("click", () => {
        window.location.href = "/invest";  // ✅ Flask 라우트 연결
      });
    }
  });
     const selectedKeyword = sessionStorage.getItem("selectedKeyword") || "Dream";

  fetch(`/market_data/${selectedKeyword}`)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        document.getElementById("keywordTitle").innerText = "Not Found";
        return;
      }

      // 기본 정보
      document.getElementById("keywordTitle").innerText = data.keyword;
      document.getElementById("keywordDesc").innerText = data.summary;
      document.getElementById("demandText").innerText = data.stats.Demand;
      document.getElementById("usageText").innerText = data.stats.Usage;
      // document.getElementById("growthText").innerText = data.stats.Growth;
        
      const growthElem = document.getElementById("growthText");
      growthElem.innerText = data.stats.Growth;
      if (growthElem.innerText.startsWith("-")) {
          growthElem.classList.remove("text-green-400");
          growthElem.classList.add("text-red-400");
       } else {
          growthElem.classList.remove("text-red-400");
          growthElem.classList.add("text-green-400");
       }
        

        
      // Chart.js
      const ctx = document.getElementById("usageChart").getContext("2d");
      new Chart(ctx, {
        type: "line",
        data: {
          labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
          datasets: [{
            label: `Usage of ${data.keyword}`,
            data: data.stats.History,
            borderColor: "rgb(99, 102, 241)",
            backgroundColor: "rgba(99, 102, 241, 0.3)",
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#9CA3AF" } },
            y: { ticks: { color: "#9CA3AF" } }
          }
        }
      });

      // Creator Insight
      document.getElementById("creatorInsight").innerText =
        `Creators are increasingly using '${data.keyword}' in their dream stories.`;
    })
    .catch(err => console.error("Error fetching market data:", err));
</script>

{% include 'footer.html' %}
</body>
</html>
